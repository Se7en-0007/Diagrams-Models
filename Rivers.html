html,body{height:100%}
body{background:var(--sea);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

.zoom button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 17px var(--font);border-radius:10px;width:38px;height:38px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 13px var(--font);border-radius:9px;min-height:38px;padding:0 14px;cursor:pointer}

#legend span{display:flex;align-items:center;gap:5px}

#toast.on{opacity:1}
aside{width:380px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pane{overflow:auto;padding:14px 16px 24px;flex:1;min-height:0;overscroll-behavior:contain}
.search{width:100%;box-sizing:border-box;font:15px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--chip);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:12.5px;color:var(--muted);line-height:1.45}
.link{border:0;background:none;color:var(--river);font:600 12.5px var(--font);cursor:pointer;padding:2px 0}
.grp{margin-top:14px}

.item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--chip)}
.item.sel{background:var(--chip);box-shadow:inset 3px 0 0 var(--sel)}
.item .nm{flex:1;min-width:0}
.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.tag.a{color:var(--sel);border-color:var(--sel)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--river);margin:0;cursor:pointer;flex:none}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.card h2{margin:0;font-size:19px;letter-spacing:-.01em}
.card .alt{color:var(--muted);font-size:13px;margin-top:2px}
.card .rel{font-weight:600;font-size:13.5px;margin-top:8px}
.card ul{margin:8px 0 0;padding-left:18px;line-height:1.45}
.card li{margin:3px 0}
.warn{margin-top:8px;font-size:12.5px;line-height:1.4;background:var(--chip);border-radius:8px;padding:7px 9px}
.warn b{color:var(--sel)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:500 12.5px var(--font);border-radius:999px;padding:4px 10px;cursor:pointer}
.prompt{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;text-wrap:balance}
.score{font-variant-numeric:tabular-nums;font-weight:600}

.opts button.no{background:var(--bad);border-color:var(--bad);color:#fff}

.item{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:9px 10px;margin-top:6px;transition:border-color .15s,background .15s,transform .15s}
.item:hover{border-color:var(--accent);transform:translateX(2px)}
.item.sel{box-shadow:none;border-color:var(--sel);background:color-mix(in srgb,var(--sel) 12%,var(--chip))}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.item .go{color:var(--muted);font-size:16px}
.card{background:var(--chip);border-color:var(--line);animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

function kmToRiver(wxp,wyp,id){let best=1e9,np=null;const lat=latOf(wyp);const kx=111.32*Math.cos(lat*Math.PI/180)/SX,ky=110.57/SY;for(const a of RV[id].w)for(let i=2;i<a.length;i+=2){const ax=(a[i-2]-wxp)*kx,ay=(a[i-1]-wyp)*ky,bx=(a[i]-wxp)*kx,by=(a[i+1]-wyp)*ky,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1e-9;const t=clamp(-(ax*dx+ay*dy)/L,0,1);const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best){best=d;np=[a[i-2]+t*(a[i]-a[i-2]),a[i-1]+t*(a[i+1]-a[i-1])]}}return[best,np]}
const latOf=Y=>LAT0-Y/SY;
/* ---------- panel ---------- */
const pane=document.getElementById('pane'),side=document.getElementById('side'),handle=document.getElementById('handle');
handle.onclick=()=>{side.classList.toggle('min');handle.textContent=side.classList.contains('min')?'Show panel ▴':'Hide panel ▾'};
function openSheet(){if(innerWidth<=820&&side.classList.contains('min'))handle.click()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function selectRiver(id,doFit=true){S.sel=id;S.lm=null;S.city=null;S.stSel=null;renderPane();if(doFit)fit(bounds([id]),.14);else invalidate();openSheet()}
function riverCard(id){const m=META[id],r=RV[id];const lms=LM.filter(l=>l.r===id);
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(m[0])}</h2><button class="link" id="closeSel">Close</button></div>${m[1]?`<div class="alt">${esc(m[1])}</div>`:''}
 <div class="small" style="margin-top:6px">${r.q==='s'?'Course: survey data (Natural Earth)':'<b style="color:var(--sel)">≈ Approximate course.</b> Drawn from reference points; the line may be 10–30 km off.'}</div>
 <div class="rel">${esc(m[3])}</div><ul>${m[4].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${lms.length?`<div class="chips">${lms.map(l=>`<button data-lm="${esc(l.n)}">${esc(l.n)}</button>`).join('')}</div>`:''}${m[5]?`<div class="warn"><b>Check:</b> ${esc(m[5])}</div>`:''}
 <label class="small row" style="margin-top:10px"><input type="checkbox" id="selStudy" ${S.study.has(id)?'checked':''}> Include in Recall and Quiz</label></div>`}
function lmCard(l){const t=TY[l.t][0];const on=l.r?`On or near the <button class="link" data-river="${l.r}">${esc(META[l.r][0])}</button>`:'';
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(l.n)}</h2><button class="link" id="closeSel">Close</button></div><div class="alt">${t} · ${l.la.toFixed(2)}°N, ${l.lo.toFixed(2)}°E (approx.)</div>${on?`<div class="rel">${on}</div>`:''}${l.note?`<div class="small" style="margin-top:6px">${esc(l.note)}</div>`:''}</div>`}
function cityCard(c){return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(c.n)}</h2><button class="link" id="closeSel">Close</button></div><div class="alt">${c.cap?'State or UT capital · ':'City · '}${c.la.toFixed(2)}°N, ${c.lo.toFixed(2)}°E</div></div>`}
function browsePane(){const q=S.q.trim().toLowerCase();const poolN=studyPool().length;
 let h=`<input class="search" id="q" placeholder="Search rivers, dams, parks, peaks, cities" value="${esc(S.q)}" autocomplete="off" aria-label="Search">
 <div class="catrow" role="group" aria-label="Category">${Object.keys(CATS).map(k=>`<button data-cat="${k}" aria-pressed="${S.cat===k}">${CATS[k][0]}</button>`).join('')}</div>
 <div class="row small" style="margin-top:8px;justify-content:space-between"><span><span class="score">${poolN}</span> of ${IDS.length} rivers in practice</span><span class="row"><button class="link" id="all">All</button><button class="link" id="none">None</button></span></div>
 <label class="small row" style="margin-top:4px"><input type="checkbox" id="useA" ${S.useApprox?'checked':''}> Include approximate-course rivers (≈) in practice</label>`;
 if(S.sel)h+=riverCard(S.sel);else if(S.lm)h+=lmCard(S.lm);else if(S.city)h+=cityCard(S.city);else if(S.stSel)h+=`<div class="card"><h2>${esc(S.stSel)}</h2><div class="alt">${UTS.has(S.stSel)?'Union territory':'State'}${S.stSel==='Jammu & Kashmir and Ladakh'?' · two UTs since 2019; the boundary data shows them as one area':''}</div></div>`;
 else h+=`<div class="small" style="margin-top:10px">Tap a river, point, city or state. Drag to pan; pinch or scroll to zoom. Zoom in to see raised, flowing rivers and more points.</div>`;
 if(q.length>=2){const lmm=LM.filter(l=>l.n.toLowerCase().includes(q)).slice(0,10),cm=CITIES.filter(c=>c.n.toLowerCase().includes(q)).slice(0,6);
  if(lmm.length||cm.length){h+=`<div class="grp"><h3>Places</h3>`+lmm.map(l=>`<div class="item" data-lmn="${esc(l.n)}"><span class="nm">${esc(l.n)}<div class="small">${TY[l.t][0]}</div></span></div>`).join('')+cm.map(c=>`<div class="item" data-city="${esc(c.n)}"><span class="nm">${esc(c.n)}<div class="small">City</div></span></div>`).join('')+`</div>`}}
 const ct=CATS[S.cat]&&CATS[S.cat][1];
 if(ct){const arr=LM.filter(l=>ct.includes(l.t)).sort((a,b)=>a.n.localeCompare(b.n));h+=`<div class="grp"><h3>${CATS[S.cat][0]} · ${arr.length}</h3>`+arr.map(l=>`<div class="item" data-lmn="${esc(l.n)}"><span class="dot" style="background:${lmColor(l.t)==='fg'?'var(--fg)':lmColor(l.t)}"></span><span class="nm">${esc(l.n)}<div class="small">${l.r?esc(META[l.r][0]):TY[l.t][0]}</div></span><span class="go">›</span></div>`).join('')+`</div>`}
 else if(S.cat==='city'){h+=`<div class="grp"><h3>Cities · ${CITIES.length}</h3>`+CITIES.filter(c=>!q||c.n.toLowerCase().includes(q)).slice(0,80).map(c=>`<div class="item" data-city="${esc(c.n)}"><span class="dot" style="background:var(--lcity)"></span><span class="nm">${esc(c.n)}<div class="small">${c.cap?'Capital':'City'}</div></span><span class="go">›</span></div>`).join('')+`</div>`}
 if(S.cat==='all'||S.cat==='rivers')for(const k in SYS){const ids=IDS.filter(id=>META[id][2]===k&&(!q||(META[id][0]+' '+META[id][1]).toLowerCase().includes(q)));const nn=NONE.filter(u=>u[0]===k&&(!q||u[1].toLowerCase().includes(q)));if(!ids.length&&!nn.length)continue;
  const allIn=IDS.filter(id=>META[id][2]===k).every(id=>S.study.has(id));
  h+=`<div class="grp"><h3><input type="checkbox" data-sys="${k}" ${allIn?'checked':''} aria-label="Include all ${SYS[k]}">${SYS[k]}</h3>`;
  ids.forEach(id=>h+=`<div class="item${S.sel===id?' sel':''}" data-river="${id}"><input type="checkbox" data-st="${id}" ${S.study.has(id)?'checked':''} aria-label="Include ${esc(META[id][0])}"><span class="nm">${esc(META[id][0])}<div class="small">${esc(META[id][1]||SYS[k])}</div></span>${RV[id].q==='a'?'<span class="tag a">≈</span>':''}<span class="go">›</span></div>`);
  nn.forEach(u=>h+=`<div class="item"><span style="width:17px;flex:none"></span><span class="nm">${esc(u[1])}<div class="small">${esc(u[2])}${u[3]?` <b style="color:var(--sel)">Check:</b> ${esc(u[3])}`:''}</div></span><span class="tag">not drawn</span></div>`);
  h+=`</div>`}
 h+=`<details><summary>About the map data</summary>Base map: Natural Earth shaded relief. Surveyed river courses (${IDS.filter(i=>RV[i].q==='s').length}): Natural Earth 1:10m rivers, public domain; some lines stop up to 20 km short of the true source. Approximate courses (${IDS.filter(i=>RV[i].q==='a').length}, marked ≈): drawn by hand from reference points, snapped to the surveyed parent river at confluences. They show the right region and direction but are not survey-grade. ${NONE.length} rivers from your notes have no course data and are listed only. States: DataMeet boundaries (India's official outline). This edition predates 2019–20, so Jammu & Kashmir and Ladakh are one area, and Dadra & Nagar Haveli and Daman & Diu are separate. Points (${LM.length}): approximate positions, usually within a few km. Cities: Natural Earth populated places. Elevations in metres are rounded.</details>`;
 return h}
function renderPane(){pane.innerHTML=S.mode==='browse'?browsePane():S.mode==='recall'?recallPane():quizPane();bindPane()}
function bindPane(){const q=document.getElementById('q');if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;renderPane();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
 pane.querySelectorAll('[data-river]').forEach(el=>el.addEventListener('click',e=>{if(e.target.matches('input'))return;const id=el.dataset.river;if(S.mode!=='browse')setMode('browse');selectRiver(id)}));
 pane.querySelectorAll('[data-st]').forEach(el=>el.onchange=()=>{el.checked?S.study.add(el.dataset.st):S.study.delete(el.dataset.st);saveStudy();renderPane()});
 pane.querySelectorAll('[data-sys]').forEach(el=>el.onchange=()=>{IDS.filter(id=>META[id][2]===el.dataset.sys).forEach(id=>el.checked?S.study.add(id):S.study.delete(id));saveStudy();renderPane()});
 pane.querySelectorAll('[data-lm]').forEach(el=>el.onclick=()=>focusLm(LM.find(x=>x.n===el.dataset.lm)));
 pane.querySelectorAll('[data-lmn]').forEach(el=>el.onclick=()=>focusLm(LM.find(x=>x.n===el.dataset.lmn)));
 pane.querySelectorAll('[data-city]').forEach(el=>el.onclick=()=>{const c=CITIES.find(x=>x.n===el.dataset.city);S.city=c;S.sel=null;S.lm=null;renderPane();fit([c.x-70,c.y-70,c.x+70,c.y+70],.1);openSheet()});
 const c=document.getElementById('closeSel');if(c)c.onclick=()=>{S.sel=null;S.lm=null;S.city=null;S.stSel=null;renderPane();invalidate()};
 const ss=document.getElementById('selStudy');if(ss)ss.onchange=()=>{ss.checked?S.study.add(S.sel):S.study.delete(S.sel);saveStudy();renderPane()};
 const a=document.getElementById('all');if(a)a.onclick=()=>{S.study=new Set(IDS);saveStudy();renderPane()};const nn=document.getElementById('none');if(nn)nn.onclick=()=>{S.study.clear();saveStudy();renderPane()};
 const ua=document.getElementById('useA');if(ua)ua.onchange=()=>{S.useApprox=ua.checked;lsSet('ir3_approx',S.useApprox);renderPane()};
 pane.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{S.cat=el.dataset.cat;renderPane();invalidate()});
 pane.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>ACT[el.dataset.act]());
 pane.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>answer(el.dataset.opt))}
function focusLm(l){S.lm=l;S.sel=null;S.city=null;renderPane();fit([l.x-60,l.y-60,l.x+60,l.y+60],.1);openSheet()}
function saveStudy(){lsSet('ir3_study',[...S.study]);invalidate(false,true)}
const studyPool=()=>[...S.study].filter(id=>S.useApprox||RV[id].q==='s');
/* ---------- recall ---------- */
const score={rc:[0,0],qz:[0,0]};
function emptyPool(){return`<div class="big">Practice set is empty</div><div class="small">Open Browse and tick the rivers you want to practise.</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="toBrowse">Open Browse</button></div>`}
function newRecall(){const p=studyPool();if(!p.length){S.rc=null;renderPane();invalidate();return}let id=pick(p);if(p.length>1&&S.rc&&S.rc.id===id)id=pick(p.filter(x=>x!==id));S.rc={id,easy:S.rc?S.rc.easy:false,done:false};reveal=null;auto=true;fit(INDIA,.03);renderPane();invalidate()}
function recallTap(x,y){const rc=S.rc;if(!rc||rc.done)return;const w=toWld(x,y);let [d,np]=kmToRiver(w[0],w[1],rc.id);const tol=RV[rc.id].q==='a'?60:40;
 rc.tap=w;rc.near=np;rc.km=d;rc.tol=tol;rc.done=true;score.rc[1]++;if(d<=tol)score.rc[0]++;reveal={id:rc.id,f:0,t0:performance.now()};
 const b=bounds([rc.id]);b[0]=Math.min(b[0],w[0]);b[1]=Math.min(b[1],w[1]);b[2]=Math.max(b[2],w[0]);b[3]=Math.max(b[3],w[1]);fit(b,.14);renderPane();invalidate()}
function recallPane(){const rc=S.rc;if(!rc)return emptyPool();const m=META[rc.id];const approx=RV[rc.id].q==='a';let h=`<div class="row" style="justify-content:space-between"><span class="prompt">Locate the river</span><span class="small score">${score.rc[0]} / ${score.rc[1]} on course</span></div><div class="big">${esc(m[0])}</div>`;
 if(!rc.done)h+=`<div class="small">${SYS[m[2]]}. Tap anywhere on its course.${approx?' This river has an approximate course, so the check allows a wider margin.':''}</div><label class="small row" style="margin-top:10px"><input type="checkbox" id="easy" ${rc.easy?'checked':''}> Show unlabelled rivers (easier)</label><div class="row" style="margin-top:12px"><button class="btn" data-act="skipRc">Show answer</button></div>`;
 else{const d=rc.km;const ok=d<=rc.tol;const t=rc.tap?(d<=2?'Right on the course.':ok?`On the course (${Math.round(d)} km off).`:d<=120?`Close: ${Math.round(d)} km from the river.`:`${Math.round(d)} km away from the river.`):'Here is its course.';
  h+=`<div class="fb ${ok?'ok':'no'}">${t}</div><div class="small" style="margin-top:6px">${esc(m[3])}${approx?' (approximate course)':''}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="nextRc">Next river</button><button class="btn" data-river="${rc.id}">Open in Browse</button></div>`}
 return h}
/* ---------- quiz ---------- */
function nearestIds(id,n,from){const b=bounds([id]);const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;return from.filter(x=>x!==id).map(x=>{const q=bounds([x]);return[x,Math.hypot((q[0]+q[2])/2-cx,(q[1]+q[3])/2-cy)]}).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function newQuiz(){const p=studyPool();if(!p.length){S.qz=null;renderPane();invalidate();return}reveal=null;
 const types=['hi','hi','letters','pt'];if(LM.some(l=>l.r&&p.includes(l.r)))types.push('lm','lm');const t=pick(types);let q={t,done:false};const all=IDS;
 if(t==='hi'){const ans=pick(p);q.ans=ans;q.hi=ans;q.opts=shuffle([ans,...shuffle(nearestIds(ans,6,all)).slice(0,3)]).map(x=>[x,META[x][0]]);q.text='Which river is highlighted?';const b=bounds([ans]);const m=Math.max(b[2]-b[0],b[3]-b[1])*.7+60;auto=false;fit([b[0]-m,b[1]-m,b[2]+m,b[3]+m],.05)}
 else if(t==='letters'){const ans=pick(p);const o=shuffle(nearestIds(ans,6,all)).slice(0,3);q.letters=shuffle([ans,...o]);q.ans=ans;q.opts=q.letters.map((x,i)=>[x,'ABCD'[i]]);q.text=`Which line is the ${META[ans][0]}?`;auto=false;fit(bounds(q.letters),.14)}
 else if(t==='lm'){const l=pick(LM.filter(l=>l.r&&p.includes(l.r)));q.lm=l;q.ans=l.r;q.opts=shuffle([l.r,...shuffle(nearestIds(l.r,6,all)).slice(0,3)]).map(x=>[x,META[x][0]]);q.text=`${l.n} (${TY[l.t][0].toLowerCase()}) lies on which river?`;const b=bounds([l.r,...nearestIds(l.r,2,all)]);auto=false;fit([Math.min(b[0],l.x-60),Math.min(b[1],l.y-60),Math.max(b[2],l.x+60),Math.max(b[3],l.y+60)],.12)}
 else{const kinds=['dam','park','falls','peak','lake','glacier'];const k=pick(kinds);const pool=LM.filter(l=>l.t===k);const tg=pick(pool);const o=shuffle(pool.filter(l=>l!==tg)).slice(0,3);q.pts=shuffle([tg,...o]);q.ans=String(q.pts.indexOf(tg));q.opts=q.pts.map((l,i)=>[String(i),'ABCD'[i]]);q.text=`Which marker is ${tg.n}?`;q.tg=tg;const xs=q.pts.map(l=>l.x),ys=q.pts.map(l=>l.y);auto=false;fit([Math.min(...xs)-30,Math.min(...ys)-30,Math.max(...xs)+30,Math.max(...ys)+30],.14)}
 S.qz=q;renderPane();invalidate()}
function answer(id){const q=S.qz;if(!q||q.done)return;q.done=true;q.pick=id;score.qz[1]++;if(id===q.ans)score.qz[0]++;if(q.t==='pt'){S.lm=null}renderPane();invalidate()}
function quizPane(){const q=S.qz;if(!q)return emptyPool();let h=`<div class="row" style="justify-content:space-between"><span class="prompt">Map quiz</span><span class="small score">${score.qz[0]} / ${score.qz[1]} correct</span></div><div class="big" style="font-size:21px">${esc(q.text)}</div><div class="opts">`;
 q.opts.forEach(([id,label])=>{let c='';if(q.done){if(id===q.ans)c='ok';else if(id===q.pick)c='no'}h+=`<button class="${c}" data-opt="${esc(id)}" ${q.done?'disabled':''}>${esc(label)}</button>`});h+=`</div>`;
 if(q.done){const ok=q.pick===q.ans;let ex='';if(q.t==='pt'){const l=q.tg;ex=`${l.n}: ${TY[l.t][0].toLowerCase()}${l.note?'. '+l.note:''}`}else ex=`${META[q.ans][0]}: ${META[q.ans][3]}`;
  h+=`<div class="fb ${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'} ${esc(ex)}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="nextQz">Next question</button>${q.t==='pt'?`<button class="btn" data-lmn2="1" data-act="toBrowse">Open Browse</button>`:`<button class="btn" data-river="${q.ans}">Open in Browse</button>`}</div>`}
 return h}
const ACT={nextRc:newRecall,skipRc:()=>{const rc=S.rc;rc.done=true;rc.tap=null;rc.near=null;rc.km=1e9;rc.tol=0;score.rc[1]++;reveal={id:rc.id,f:0,t0:performance.now()};fit(bounds([rc.id]),.14);renderPane();invalidate()},nextQz:newQuiz,toBrowse:()=>setMode('browse')};
pane.addEventListener('change',e=>{if(e.target.id==='easy'){S.rc.easy=e.target.checked;invalidate()}});
/* ---------- modes ---------- */
function setMode(m){S.mode=m;['browse','recall','quiz'].forEach(k=>document.getElementById('m-'+k).setAttribute('aria-pressed',k===m));reveal=null;
 if(m==='recall')newRecall();else if(m==='quiz')newQuiz();else{renderPane();auto=!S.sel;fit(S.sel?bounds([S.sel]):INDIA,S.sel?.14:.03)}invalidate()}
['browse','recall','quiz'].forEach(k=>document.getElementById('m-'+k).onclick=()=>setMode(k));
/* ---------- theme ---------- */
const themeBtn=document.getElementById('theme');function setTheme(m){document.documentElement.setAttribute('data-theme',m);themeBtn.textContent=m==='dark'?'☀':'☾';lsSet('ir3_theme',m)}
themeBtn.onclick=()=>setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
setTheme(lsGet('ir3_theme')==='light'?'light':'dark');
/* ---------- boot ---------- */
new MutationObserver(()=>{readCols();invalidate()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readCols();invalidate()});
new ResizeObserver(resize).observe(stage);addEventListener('resize',resize);
resize();renderPane();document.fonts&&document.fonts.ready.then(()=>invalidate());
window.__IR={S,V,RV,LM,fit,INDIA,setMode,selectRiver,studyPool};
</script>
