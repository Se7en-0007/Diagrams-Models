<title>Ocean Currents Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 3D globe stage beside a study panel (stacked on phones). Single deep-sea dark look by choice. */
:root{--bg:#06121d;--panel:#0b2032;--ink:#e6f0f7;--mut:#b4cbda;--line:#1b3b55;--warm:#ff6a47;--cold:#5ec9ff;--neu:#dfe8ee;--ok:#4fd18b;
--disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;color-scheme:dark}
html,body{height:100%;box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;height:100%}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:42% minmax(0,1fr)}}
.stage{position:relative;min-height:0;min-width:0;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0e2d47,#06121d 70%);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font:700 12px/1 var(--body);white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000,0 0 7px #000;display:none}
.lab.w{color:#ff9a80}.lab.c{color:#9fdcff}.lab.n{color:#fff}
.leg{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--mut)}
.leg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.zm{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.zm button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#0b2032cc;color:var(--ink);font-size:18px;cursor:pointer}
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
h1{font:700 22px/1.1 var(--disp);margin:0}
.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.tabs button,.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.tabs button.on,.chips button.on{background:var(--ink);color:#06121d;border-color:var(--ink);font-weight:600}
#rc{margin-left:auto}
button:focus-visible{outline:2px solid var(--cold);outline-offset:2px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#08192a;font-size:14.5px}
.card .hint{margin:0;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font:700 19px/1.2 var(--disp);margin:0;text-wrap:balance}
.b{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:5px;color:#06121d;white-space:nowrap}
.b.w{background:var(--warm)}.b.c{background:var(--cold)}.b.n{background:var(--neu)}
dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;line-height:1.5}
dt{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding-top:2px}
dd{margin:0}
.act{margin-top:8px;border:1px solid var(--cold);background:transparent;color:var(--cold);border-radius:8px;padding:6px 12px;cursor:pointer}
.opts{display:grid;gap:6px;margin-top:8px}
.opts button{text-align:left;border:1px solid var(--line);background:#0b2032;border-radius:8px;padding:8px 10px;cursor:pointer}
.opts button.ok{border-color:var(--ok);background:#12392b}.opts button.no{border-color:var(--warm);background:#3a1a14}
.it{font-size:14px}.list{overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:3px}
.it{display:flex;align-items:center;gap:9px;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer;width:100%}
.it:hover,.it.on{background:#12304a}
.it .d{width:10px;height:10px;border-radius:50%;flex:none}
.it .n{flex:1;min-width:0}
.it .o{font:500 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
</style>
