:root{--sea:#dbe6ec;--land:#f6f7f4;--land2:#e7eae6;--edge:#b6c2c8;--extr:#a7b6be;--river:#2c78bd;--hi:#0a4f8f;--flow:#ffffff;--tap:#d9622b;--good:#1f8a52;--bad:#c23b2e;

:root[data-theme="dark"]{--sea:#0e1820;--land:#1f2c35;--land2:#172128;--edge:#3b4c57;--extr:#060c10;--river:#4a9fe0;--hi:#9fd0ff;--flow:#e8f4ff;--tap:#f08a4e;--good:#4cc283;--bad:#ef7468;
--fg:#e5ecf0;--muted:#94a4ad;--panel:#141f27;--line:#27353f;--chip:#1d2a33;color-scheme:dark}
html,body{height:100%}
body{background:var(--sea);color:var(--fg);font-family:var(--font);font-size:15px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;margin-right:auto}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--font);padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
main{flex:1;display:flex;min-height:0;position:relative}
#mapwrap{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.ctrls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.ctrls button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 13px var(--font);border-radius:9px;min-width:38px;height:38px;padding:0 10px;cursor:pointer}
.ctrls button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
.btn.primary{background:var(--river);border-color:var(--river);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--river);outline-offset:2px}
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 24px)}
#legend span{display:flex;align-items:center;gap:4px}
#legend i{width:9px;height:9px;display:inline-block;border-radius:2px}
aside{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pane{overflow:auto;padding:14px 16px 20px;flex:1;min-height:0}
.search{width:100%;box-sizing:border-box;font:15px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sea);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:12.5px;color:var(--muted)}
.link{border:0;background:none;color:var(--river);font:600 12.5px var(--font);cursor:pointer;padding:2px 0}
.grp{margin-top:14px}
.grp h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--chip)}
.item.sel{background:var(--chip);box-shadow:inset 3px 0 0 var(--river)}
.item .nm{flex:1;min-width:0}
.tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--river);margin:0;cursor:pointer}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.card h2{margin:0;font-size:19px;letter-spacing:-.01em}
.card .alt{color:var(--muted);font-size:13px;margin-top:2px}
.card .rel{font-weight:600;font-size:13.5px;margin-top:8px}
.card ul{margin:8px 0 0;padding-left:18px;line-height:1.45}
.card li{margin:3px 0}
.warn{margin-top:8px;font-size:12.5px;line-height:1.4;color:var(--fg);background:var(--chip);border-radius:8px;padding:7px 9px}
.warn b{color:var(--tap)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:500 12.5px var(--font);border-radius:999px;padding:4px 10px;cursor:pointer}
.prompt{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px;text-wrap:balance}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 15px var(--font);border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center}
.opts button.ok{background:var(--good);border-color:var(--good);color:#fff}
.opts button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{margin-top:10px;font-weight:600;line-height:1.4}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
details{margin-top:18px;font-size:12.5px;color:var(--muted);line-height:1.5}
summary{cursor:pointer;font-weight:600;color:var(--fg)}
#handle{display:none}
@media (max-width:820px){
 main{flex-direction:column}
 aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:0 0 auto;height:44%;transition:height .2s}
 aside.min{height:40px;overflow:hidden}
 .ctrls{right:8px;top:8px;gap:4px}.ctrls button{min-width:34px;height:34px;padding:0 7px;font-size:12px}
 #handle{display:block;border:0;background:none;padding:8px;cursor:pointer;color:var(--muted);font:600 12px var(--font)}
 .pane{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 h1{font-size:15px}.seg button{padding:7px 11px}
 .big{font-size:22px}
 #legend{display:none}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}

cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const cur=[e.offsetX,e.offsetY];
 if(ptrs.size===1){if(Math.hypot(cur[0]-gest.x,cur[1]-gest.y)>6)gest.moved=true;if(gest.moved){cv.classList.add("drag");const a=inv(prev[0],prev[1]),b=inv(cur[0],cur[1]);S.tx+=b[0]-a[0];S.ty+=b[1]-a[1];}}
 else if(ptrs.size===2){gest.moved=true;const ids=[...ptrs.keys()];const o=ids.find(i=>i!==e.pointerId);const q=ptrs.get(o);
  const d0=Math.hypot(prev[0]-q[0],prev[1]-q[1]),d1=Math.hypot(cur[0]-q[0],cur[1]-q[1]);const m0=[(prev[0]+q[0])/2,(prev[1]+q[1])/2],m1=[(cur[0]+q[0])/2,(cur[1]+q[1])/2];
  const a=inv(m0[0],m0[1]),b=inv(m1[0],m1[1]);S.tx+=b[0]-a[0];S.ty+=b[1]-a[1];if(d0>0)zoomAt(m1[0],m1[1],d1/d0,true)}
 ptrs.set(e.pointerId,cur);if(!raf)draw();});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);cv.classList.remove("drag");if(gest&&!gest.moved&&ptrs.size===0&&performance.now()-gest.t<500)onTap(e.offsetX,e.offsetY);if(ptrs.size===0)gest=null};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);gest=null});
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)))},{passive:false});
function zoomAt(sx,sy,f,noDraw){const p=inv(sx,sy);const wx=(p[0]-S.tx)/S.s,wy=(p[1]-S.ty)/S.s;const ns=Math.min(14,Math.max(.35,S.s*f));S.s=ns;S.tx=p[0]-wx*ns;S.ty=p[1]-wy*ns;if(!noDraw&&!raf)draw();}
document.getElementById("zin").onclick=()=>{zoomAt(W/2,H/2,1.5);};document.getElementById("zout").onclick=()=>{zoomAt(W/2,H/2,1/1.5)};
document.getElementById("reset").onclick=()=>fit(INDIA,.02);
const tog=(id,key,after)=>{const b=document.getElementById(id);b.setAttribute("aria-pressed",S[key]);b.onclick=()=>{S[key]=!S[key];b.setAttribute("aria-pressed",S[key]);after&&after();kick();draw()}};
tog("tilt","tilt",()=>{tA=1});tog("flow","flow");tog("lmk","lmk");
/* hit testing */
function hitRiver(x,y,tol=14,pool=IDS){let best=null,bd=tol;for(const id of pool){for(const s of SCR[id]||[])for(let i=1;i<s.length;i++){const d=segD(x,y,s[i-1],s[i]);if(d<bd){bd=d;best=id}}}return best}
function segD(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1e-9;let t=((x-a[0])*dx+(y-a[1])*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
function hitLm(x,y){let b=null,bd=13;LMS.forEach(([l,p])=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;b=l}});return b}
function toLonLat(sx,sy){const p=inv(sx,sy);const X=(p[0]-S.tx)/S.s,Y=(p[1]-S.ty)/S.s;return[X/(K*C0)+82,-Y/K+22]}
function hitState(sx,sy){const p=inv(sx,sy);const X=(p[0]-S.tx)/S.s,Y=(p[1]-S.ty)/S.s;for(const s of ST)for(const r of s.r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){if((r[i][1]>Y)!==(r[j][1]>Y)&&X<(r[j][0]-r[i][0])*(Y-r[i][1])/(r[j][1]-r[i][1])+r[i][0])c=!c}if(c)return s.n}return null}
function onTap(x,y){if(S.mode==="browse"){const l=hitLm(x,y);if(l){S.lmSel=l;S.sel=null;S.stSel=null;renderPane();kick();draw();return}
  const r=hitRiver(x,y);if(r){selectRiver(r,false);return}S.stSel=hitState(x,y);S.sel=null;S.lmSel=null;renderPane();draw();return}
 if(S.mode==="recall")recallTap(x,y);}
/* ---------- geo distance ---------- */
function kmToRiver(lon,lat,id){let best=1e9,np=null;const k=Math.cos(lat*Math.PI/180)*111.3;for(const s of G.rv[id])for(let i=1;i<s.length;i++){const ax=(s[i-1][0]-lon)*k,ay=(s[i-1][1]-lat)*110.6,bx=(s[i][0]-lon)*k,by=(s[i][1]-lat)*110.6;const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1e-9;let t=-(ax*dx+ay*dy)/L;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best){best=d;np=[s[i-1][0]+t*(s[i][0]-s[i-1][0]),s[i-1][1]+t*(s[i][1]-s[i-1][1])]}}return[best,np]}
const cen=id=>{const b=bbox([id]);return[(b[0]+b[2])/2,(b[1]+b[3])/2]};
/* ---------- panel ---------- */
const pane=document.getElementById("pane"),side=document.getElementById("side");
document.getElementById("handle").onclick=()=>{side.classList.toggle("min");document.getElementById("handle").textContent=side.classList.contains("min")?"Show panel ▴":"Hide panel ▾";setTimeout(resize,220)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function selectRiver(id,doFit=true){S.sel=id;S.lmSel=null;S.stSel=null;renderPane();if(doFit)fit(bbox([id]),.14);kick();draw();
 if(innerWidth<=820&&side.classList.contains("min"))document.getElementById("handle").click();}
function riverCard(id){const [n,a,sys,rel,f,w]=META[id];const lms=LM.filter(l=>l.r===id);
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(n)}</h2><button class="link" id="closeSel">Close</button></div>${a?`<div class="alt">${esc(a)}</div>`:""}<div class="rel">${esc(rel)}</div><ul>${f.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
 ${lms.length?`<div class="chips">${lms.map(l=>`<button data-lm="${esc(l.n)}">${esc(l.n)}</button>`).join("")}</div>`:""}${w?`<div class="warn"><b>Check:</b> ${esc(w)}</div>`:""}
 <div class="row" style="margin-top:10px"><label class="small row"><input type="checkbox" id="selStudy" ${S.study.has(id)?"checked":""}> Include in Recall and Quiz</label></div></div>`}
function lmCard(l){const t=TYPES[l.t][0];const on=l.r?`On / near the <button class="link" data-river="${l.r}">${esc(META[l.r][0])}</button>`:"";
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(l.n)}</h2><button class="link" id="closeSel">Close</button></div><div class="alt">${t} · ${l.la.toFixed(2)}°N, ${l.lo.toFixed(2)}°E (approx.)</div>${on?`<div class="rel">${on}</div>`:""}${LMN[l.n]?`<div class="small" style="margin-top:6px">${esc(LMN[l.n])}</div>`:""}</div>`}
function browsePane(){const q=S.q.toLowerCase();let h=`<input class="search" id="q" placeholder="Search rivers" value="${esc(S.q)}" autocomplete="off">
 <div class="row small" style="margin-top:8px;justify-content:space-between"><span><span class="score">${S.study.size}</span> of ${IDS.length} mapped rivers in study set</span><span class="row"><button class="link" id="all">All</button><button class="link" id="none">None</button></span></div>`;
 if(S.sel)h+=riverCard(S.sel);else if(S.lmSel)h+=lmCard(S.lmSel);else if(S.stSel)h+=`<div class="card"><h2>${esc(S.stSel)}</h2><div class="alt">${UTS.has(S.stSel)?"Union territory":"State"}${S.stSel==="J&K and Ladakh"?" · two UTs since 2019, shown as one area in the boundary data":""}</div></div>`;
 else h+=`<div class="small" style="margin-top:10px">Tap a river, a point or a state on the map. Drag to pan; pinch or scroll to zoom.</div>`;
 for(const k in SYS){const ids=IDS.filter(id=>META[id][2]===k&&(!q||(META[id][0]+" "+META[id][1]).toLowerCase().includes(q)));const und=UND.filter(u=>u[0]===k&&(!q||u[1].toLowerCase().includes(q)));if(!ids.length&&!und.length)continue;
  const allIn=IDS.filter(id=>META[id][2]===k).every(id=>S.study.has(id));
  h+=`<div class="grp"><h3><input type="checkbox" data-sys="${k}" ${allIn?"checked":""} aria-label="Include all ${SYS[k]}">${SYS[k]}</h3>`;
  ids.forEach(id=>h+=`<div class="item${S.sel===id?" sel":""}" data-river="${id}"><input type="checkbox" data-st="${id}" ${S.study.has(id)?"checked":""} aria-label="Include ${esc(META[id][0])}"><span class="nm">${esc(META[id][0])}</span></div>`);
  und.forEach(u=>h+=`<div class="item" data-und="${esc(u[1])}"><span style="width:17px"></span><span class="nm">${esc(u[1])}<div class="small">${esc(u[2])}${u[3]?` <b style="color:var(--tap)">· Check:</b> ${esc(u[3])}`:""}</div></span><span class="tag">not mapped</span></div>`);
  h+=`</div>`}
 h+=`<details><summary>About the map data</summary>River courses: Natural Earth 1:10m rivers (public domain). ${IDS.length} rivers are drawn; ${UND.length} smaller rivers from your notes are listed without a course because they are not in that dataset, and they are left out of Recall and Quiz. Lines may stop short of exact headwaters. States: DataMeet India boundaries. This edition predates 2019–20, so J&K and Ladakh appear as one area, and Dadra & Nagar Haveli and Daman & Diu appear separately (merged into one UT in 2020). Neighbouring countries: Natural Earth 1:50m. Landmark positions are approximate (within a few km) and come from general reference coordinates. "Check" notes mark places where your notes differ from standard sources.</details>`;
 return h}
function renderPane(){if(S.mode==="browse")pane.innerHTML=browsePane();else if(S.mode==="recall")pane.innerHTML=recallPane();else pane.innerHTML=quizPane();bindPane();}
function bindPane(){const q=document.getElementById("q");if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;renderPane();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
 pane.querySelectorAll("[data-river]").forEach(el=>el.addEventListener("click",e=>{if(e.target.matches("input"))return;const id=el.dataset.river;if(S.mode!=="browse")setMode("browse");selectRiver(id)}));
 pane.querySelectorAll("[data-st]").forEach(el=>el.onchange=()=>{el.checked?S.study.add(el.dataset.st):S.study.delete(el.dataset.st);saveStudy();renderPane()});
 pane.querySelectorAll("[data-sys]").forEach(el=>el.onchange=()=>{IDS.filter(id=>META[id][2]===el.dataset.sys).forEach(id=>el.checked?S.study.add(id):S.study.delete(id));saveStudy();renderPane()});
 pane.querySelectorAll("[data-lm]").forEach(el=>el.onclick=()=>{const l=LM.find(x=>x.n===el.dataset.lm);S.lmSel=l;S.sel=null;renderPane();fit([l.x-60,l.y-60,l.x+60,l.y+60]);kick()});
 const c=document.getElementById("closeSel");if(c)c.onclick=()=>{S.sel=null;S.lmSel=null;S.stSel=null;renderPane();draw()};
 const ss=document.getElementById("selStudy");if(ss)ss.onchange=()=>{ss.checked?S.study.add(S.sel):S.study.delete(S.sel);saveStudy();renderPane()};
 const a=document.getElementById("all");if(a)a.onclick=()=>{S.study=new Set(IDS);saveStudy();renderPane()};const nn=document.getElementById("none");if(nn)nn.onclick=()=>{S.study.clear();saveStudy();renderPane()};
 pane.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>ACT[el.dataset.act]());}
const pick=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>[...S.study];
/* ---------- recall ---------- */
const score={rc:[0,0],qz:[0,0]};
function newRecall(){const p=pool();if(!p.length){S.rc=null;renderPane();draw();return}let id=pick(p);if(p.length>1&&S.rc&&S.rc.id===id)id=pick(p.filter(x=>x!==id));S.rc={id,easy:S.rc?S.rc.easy:false,done:false};reveal=null;fit(INDIA,.04);renderPane();}
function recallTap(x,y){const rc=S.rc;if(!rc||rc.done)return;const [lo,la]=toLonLat(x,y);let [d,np]=kmToRiver(lo,la,rc.id);
 if(rc.easy){const h=hitRiver(x,y,14);if(h===rc.id)d=0}
 rc.tap=[px(lo),py(la)];rc.near=np?[px(np[0]),py(np[1])]:null;rc.km=d;rc.done=true;score.rc[1]++;if(d<=40)score.rc[0]++;reveal={id:rc.id,f:0,t0:performance.now()};
 const b=bbox([rc.id]);b[0]=Math.min(b[0],rc.tap[0]);b[1]=Math.min(b[1],rc.tap[1]);b[2]=Math.max(b[2],rc.tap[0]);b[3]=Math.max(b[3],rc.tap[1]);fit(b,.12);renderPane();kick();}
function recallPane(){const rc=S.rc;if(!rc)return emptyPool();const m=META[rc.id];let h=`<div class="row" style="justify-content:space-between"><span class="prompt">Locate the river</span><span class="small score">${score.rc[0]} / ${score.rc[1]} on course</span></div><div class="big">${esc(m[0])}</div>`;
 if(!rc.done)h+=`<div class="small">${SYS[m[2]]}. Tap anywhere on its course.</div><label class="small row" style="margin-top:10px"><input type="checkbox" id="easy" ${rc.easy?"checked":""}> Show unlabelled rivers (easier)</label><div class="row" style="margin-top:12px"><button class="btn" data-act="skipRc">Show answer</button></div>`;
 else{const d=rc.km;const ok=d<=40;const t=d===0?"Right on the course.":d<=40?`On the course (${Math.round(d)} km off).`:d<=120?`Close: ${Math.round(d)} km from the river.`:`${Math.round(d)} km away from the river.`;
  h+=`<div class="fb ${ok?"ok":"no"}">${rc.tap?t:"Here is its course."}</div><div class="small" style="margin-top:6px">${esc(m[3])}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="nextRc">Next river</button><button class="btn" data-river="${rc.id}">Open in Browse</button></div>`}
 return h}
function emptyPool(){return`<div class="big">Study set is empty</div><div class="small">Go to Browse and tick the rivers you want to practise.</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="toBrowse">Open Browse</button></div>`}
/* ---------- quiz ---------- */
function nearest(id,n,from){const c=cen(id);return(from||IDS).filter(x=>x!==id).map(x=>{const d=cen(x);return[x,Math.hypot(d[0]-c[0],d[1]-c[1])]}).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function newQuiz(){const p=pool();if(!p.length){S.qz=null;renderPane();draw();return}const ans=pick(p);const types=["hi","hi","letters"];if(LM.some(l=>l.r&&S.study.has(l.r)))types.push("lm","lm");const t=pick(types);let q={t,done:false};
 if(t==="hi"){q.ans=ans;q.hi=ans;q.opts=shuffle([ans,...shuffle(nearest(ans,6)).slice(0,3)]).map(x=>[x,META[x][0]]);q.text="Which river is highlighted?";fitQ([ans],.18,true)}
 else if(t==="letters"){const others=shuffle(nearest(ans,5)).slice(0,3);q.letters=shuffle([ans,...others]);q.ans=ans;q.opts=q.letters.map((x,i)=>[x,"ABCD"[i]]);q.text=`Which line is the ${META[ans][0]}?`;fitQ(q.letters,.1)}
 else{const l=pick(LM.filter(l=>l.r&&S.study.has(l.r)));q.lm=l;q.ans=l.r;q.opts=shuffle([l.r,...shuffle(nearest(l.r,6)).slice(0,3)]).map(x=>[x,META[x][0]]);q.text=`${l.n} (${TYPES[l.t][0].toLowerCase()}) lies on which river?`;fitQ([l.r,...nearest(l.r,2)],.12)}
 S.qz=q;renderPane();kick();}
function fitQ(ids,pad,wide){const b=bbox(ids);if(wide){const w=Math.max(b[2]-b[0],b[3]-b[1])*0.6;b[0]-=w;b[2]+=w;b[1]-=w;b[3]+=w}fit(b,pad)}
function answer(id){const q=S.qz;if(!q||q.done)return;q.done=true;q.pick=id;score.qz[1]++;if(id===q.ans)score.qz[0]++;if(q.t!=="hi")fitQ([q.ans].concat(q.letters||[]),.12);renderPane();kick();draw()}
function quizPane(){const q=S.qz;if(!q)return emptyPool();let h=`<div class="row" style="justify-content:space-between"><span class="prompt">Map quiz</span><span class="small score">${score.qz[0]} / ${score.qz[1]} correct</span></div><div class="big" style="font-size:21px">${esc(q.text)}</div><div class="opts">`;
 q.opts.forEach(([id,label])=>{let c="";if(q.done){if(id===q.ans)c="ok";else if(id===q.pick)c="no"}h+=`<button class="${c}" data-opt="${id}" ${q.done?"disabled":""}>${esc(label)}</button>`});h+=`</div>`;
 if(q.done){const ok=q.pick===q.ans;h+=`<div class="fb ${ok?"ok":"no"}">${ok?"Correct.":"Not quite."} ${esc(META[q.ans][0])}: ${esc(META[q.ans][3])}</div><div class="row" style="margin-top:12px"><button class="btn primary" data-act="nextQz">Next question</button><button class="btn" data-river="${q.ans}">Open in Browse</button></div>`}
 return h}
const ACT={nextRc:newRecall,skipRc:()=>{const rc=S.rc;rc.done=true;rc.tap=null;rc.near=null;rc.km=1e9;score.rc[1]++;reveal={id:rc.id,f:0,t0:performance.now()};fit(bbox([rc.id]),.14);renderPane();kick()},nextQz:newQuiz,toBrowse:()=>setMode("browse")};
pane.addEventListener("click",e=>{const b=e.target.closest("[data-opt]");if(b)answer(b.dataset.opt)});
pane.addEventListener("change",e=>{if(e.target.id==="easy"){S.rc.easy=e.target.checked;draw()}});
/* ---------- modes ---------- */
function setMode(m){S.mode=m;["browse","recall","quiz"].forEach(k=>document.getElementById("m-"+k).setAttribute("aria-pressed",k===m));reveal=null;
 if(m==="recall")newRecall();else if(m==="quiz")newQuiz();else{renderPane();fit(S.sel?bbox([S.sel]):INDIA,.04)}kick();draw()}
["browse","recall","quiz"].forEach(k=>document.getElementById("m-"+k).onclick=()=>setMode(k));
addEventListener("resize",resize);new ResizeObserver(resize).observe(document.getElementById("mapwrap"));
resize();fit(INDIA,.02,false);renderPane();kick();
document.fonts&&document.fonts.ready.then(()=>draw());
</script>

</body></html>
